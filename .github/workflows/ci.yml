name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: ASCII-only source check
        run: |
          if grep -rnP '[^\x00-\x7F]' --include='*.py' --include='*.toml' --include='*.yml' src tests pyproject.toml .github; then
            echo "Non-ASCII characters found (see lines above); use ASCII equivalents."
            exit 1
          fi

      - name: Lint
        run: uv run ruff check src/ tests/

      - name: Format check
        run: uv run ruff format --check src/ tests/

      - name: Test
        run: uv run pytest tests/ -q
